mvrm:
  # noise_lvl: 0.0
  noise_lvl: 0.3
  lq_latent_cond: addition    # [addition, concat]
  train:
    # DPT Head input feats = [19, 27, 33, 39]
    extract_feat_layers: [17]
    # extract_feat_layers: [31]
    # extract_feat_layers: [39]
    concat_feat: False
    break_and_return_feat: false
  val:
    restore_feat_layers: [17]
    # restore_feat_layers: [31]
    # restore_feat_layers: [39]
    concat_feat: False 
    skip_and_input_feat: false
    guidance:
      use_cfg: false
      cfg_scale: 1.0

      # use_cfg: true
      # cfg_scale: 1.5

      # use_cfg: true
      # cfg_scale: 2.0

      # use_cfg: true
      # cfg_scale: 4.0

    analysis:
      # vis_attn_map: true 
      vis_attn_map: false
      mvrm_attn_map:
        extract_idx: [1,3,5,7,9,11,13]


    ## set to false for UNCOND samping inference !!
    # lq_cond_sampling: true
    lq_cond_sampling: false




analysis_LQ:
  # vis_map: true
  vis_map: false

  # vis_pc: true 
  vis_pc: false
  vis_pc_temperature: 0.01

  da3_attn_map:
    extract_idx: [15, 19, 23, 27,  31,  35, 39]



analysis_HQ:
  # vis_map: true
  vis_map: false

  # vis_pc: true 
  vis_pc: false
  vis_pc_temperature: 0.01

  da3_attn_map:
    extract_idx: [15, 19, 23, 27,  31,  35, 39]



analysis_RES:
  # vis_map: true
  vis_map: false

  # vis_pc: true 
  vis_pc: false
  vis_pc_temperature: 0.01

  da3_attn_map:
    extract_idx: [15, 19, 23, 27,  31,  35, 39]



transport:
  params:
    path_type: 'Linear'
    prediction: 'velocity'
    loss_weight: null
    time_dist_type: 'logit-normal_0_1'
sampler:
  mode: ODE
  params:
    sampling_method: 'euler'
    num_steps: 50
    atol: 1.0e-6
    rtol: 1.0e-3
    reverse: false
misc:
  latent_size: 
  num_classes: 
  time_dist_shift_dim: 1492992  # 1536*27*36
  time_dist_shift_base: 4096


