
# ==============================================================================
# MVRM Configuration
# ==============================================================================
MVRM_EVAL:
  # [wo_mvrm_HQ, wo_mvrm_LQ, wo_mvrm_IR, w_mvrm]
  eval_method: w_mvrm
  load_lq: true
  load_res: false
  
  rgb_decoder: 
    stage_1:
      target: GLD.src.stage1.rae_da3.RAE_DA3
      params:
        encoder_pretrained_path: 'depth-anything/DA3-Base'
        encoder_input_size: 252  # DA3 standard input size
        encoder_type: 'DA3EncoderDirect'
        decoder_config_path: 'GLD/configs/decoder/ViTXL'
        dpt_decoder_path: 'GLD/pretrained_models/da3/dpt_decoder.pt'
        da3_weights_path: 'GLD/pretrained_models/da3/model.safetensors'
        dpt_model_type: 'da3-base'
        mae_weight: 'GLD/pretrained_models/mae_decoder.pt'
        noise_tau: 0.0
        reshape_to_2d: true
        normalization_stat_path: 'model_stats/da3/normalization_stats_level0.pt'
  
    vis_rgb_LQ: true 
    vis_rgb_HQ: true 
    vis_rgb_RES: true
    vis_rgb_framewise: true


# ==============================================================================
# Denoiser Configuration
# ==============================================================================
denoiser:
  model: DiTwDDTHeadMVRM_Multiview
  target: RAE.src.stage2.models.DDT_MVRM_multiview.DiTwDDTHeadMVRM_Multiview
  params:
    # input_size: [27, 36]  # feat_H, feat_W
    input_size: 
    patch_size: 1
    # in_channels: 1536
    in_channels: 768
    

    # hidden_size: [1536, 3072]
    # depth: [28, 2]

    # hidden_size: [1536, 3072]
    # depth: [22, 4]

    # hidden_size: [1536, 3072]
    # depth: [12, 6]

    hidden_size: [768, 2048]
    # hidden_size: [1536, 3072]


    depth: [8, 6]


    num_heads: [16, 16]
    mlp_ratio: 4.0
    class_dropout_prob:
    num_classes: 
    use_qknorm: true 
    use_swiglu: true
    use_rope: true
    use_rmsnorm: true
    wo_shift: false
    use_pos_embed: false
    use_global_residual: false




  ##################
  ##### 260413 #####
  ##################

  ## 25k__enc8-dec6__DA3-BASE
  # ckpt: /media/data1/MV_Restoration/pho_mvr/result_train/nips26/multi_view/260413/hypersim-tartanair/TRAIN__fp32__hypersim-tartanair__near_camera-near_random__da3-BASE-extractfeat3-mvrm__bs4-maxview4-accum1__lr-2e-04__msg-lqkernel50-300__blur00-03__ema95__hyp1tar1__ddt-enc8-dec6__lqdrop01/checkpoints/ep-0025000.pt


