mvrm:
  # noise_lvl: 0.0
  noise_lvl: 0.3
  lq_latent_cond: addition    # [addition, concat]
  train:
    # DPT Head input feats = [5, 7, 9, 11]
    extract_feat_layers: [3]
    concat_feat: False
    break_and_return_feat: false
  val:
    restore_feat_layers: [3]
    concat_feat: False 
    skip_and_input_feat: false
    guidance:
      use_cfg: false
      cfg_scale: 1.0

      # use_cfg: true
      # cfg_scale: 1.5

      # use_cfg: true
      # cfg_scale: 2.0

      # use_cfg: true
      # cfg_scale: 4.0

    analysis:
      # vis_attn_map: true 
      vis_attn_map: false
      mvrm_attn_map:
        extract_idx: [1,3,5,7,9,11,13]
    

    ## set to false for UNCOND samping inference !!
    lq_cond_sampling: true
    # lq_cond_sampling: false






